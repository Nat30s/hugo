<ul class="post-list">
  {{ range (where site.RegularPages "Section" "posts").ByDate.Reverse }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      <div class="byline">{{ .Date.Format "Jan 2, 2006" }}{{ with .Params.category }} &nbsp;·&nbsp; {{ . }}{{ end }}</div>
      {{ with .Description }}<p>{{ . }}</p>{{ end }}
    </li>
  {{ end }}
</ul>
