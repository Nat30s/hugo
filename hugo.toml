# Change these two values. The workflow overrides baseURL automatically on GitHub Pages.
baseURL = "https://example.github.io/my-site/"
title = "My News Site"
locale = "en"

# Posts use `pubDate` in frontmatter as their date.
[frontmatter]
  date = ["pubDate", ":default"]

theme = "blank-magazine"


[pagination]
  pagerSize = 9

[params]
  author = "Your Name"
  authorBio = "writer / reader / walker"
  slogan = "A quiet place for words worth re-reading."
  email = "hello@example.com"
  mainSections = ["posts"]

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML", "RSS", "JSON"]